<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 知识手册</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0e;--bg2:#151815;--bg3:#1c1f1c;--bg4:#242724;
  --fg:#e8e6e1;--fg2:#b0aea5;--fg3:#7a7970;
  --accent:#d4a843;--accent-d:rgba(212,168,67,.12);--accent-b:rgba(212,168,67,.25);
  --cyan:#5bb8c9;--cyan-d:rgba(91,184,201,.1);
  --green:#4a9e6e;--green-d:rgba(74,158,110,.1);
  --red:#c95a4b;--red-d:rgba(201,90,75,.1);
  --orange:#d98a3a;--orange-d:rgba(217,138,58,.1);
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --r:10px;--rs:6px;--tr:.25s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{font-family:'Noto Sans SC','Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);line-height:1.7;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

/* 侧边栏 */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--bg2);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:transform .35s ease}
.sidebar-head{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.sidebar-head h1{font-family:'Space Grotesk';font-size:1.1rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.sidebar-head p{font-size:.72rem;color:var(--fg3);margin-top:4px}
.sidebar-search{padding:10px 14px}
.sidebar-search input{width:100%;padding:8px 12px 8px 34px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--fg);font-size:.82rem;outline:none;transition:var(--tr)}
.sidebar-search input:focus{border-color:var(--accent-b)}
.sidebar-search{position:relative}
.sidebar-search i{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:.8rem}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-cat{padding:8px 18px 4px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3)}
.nav-cat:first-child{padding-top:12px}
.nav-link{display:flex;align-items:center;gap:8px;padding:6px 18px;font-size:.82rem;color:var(--fg2);text-decoration:none;transition:var(--tr);cursor:pointer;border-left:2px solid transparent}
.nav-link:hover{color:var(--fg);background:rgba(255,255,255,.02)}
.nav-link.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-d)}
.nav-link i{width:16px;text-align:center;font-size:.72rem;color:var(--fg3)}
.nav-link.active i{color:var(--accent)}
.sidebar-count{margin-left:auto;font-size:.68rem;color:var(--fg3);background:var(--bg);padding:1px 7px;border-radius:9px}

/* 主内容 */
.main{margin-left:260px;min-height:100vh;position:relative}
.main-inner{max-width:960px;margin:0 auto;padding:30px 32px 80px}

/* 分类标题 */
.cat-section{margin-bottom:3rem}
.cat-title{font-family:'Space Grotesk','Noto Sans SC';font-size:1.5rem;font-weight:700;margin-bottom:.3rem;display:flex;align-items:center;gap:10px}
.cat-title i{font-size:1.1rem;color:var(--accent)}
.cat-desc{color:var(--fg3);font-size:.88rem;margin-bottom:1.5rem}

/* 标签卡片网格 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}

.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:var(--tr)}
.card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card-head{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-tag{font-family:'Space Grotesk',monospace;font-size:1.05rem;font-weight:700;color:var(--accent)}
.card-badge{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px}
.badge-block{background:var(--accent-d);color:var(--accent)}
.badge-inline{background:var(--cyan-d);color:var(--cyan)}
.badge-void{background:var(--red-d);color:var(--red)}
.badge-meta{background:var(--green-d);color:var(--green)}
.badge-interactive{background:var(--orange-d);color:var(--orange)}
.card-attrs{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.card-attr{font-family:'Space Grotesk',monospace;font-size:.62rem;color:var(--fg3);background:var(--bg);padding:1px 6px;border-radius:3px;border:1px solid var(--border)}
.card-desc{padding:0 16px 10px;font-size:.82rem;color:var(--fg2);line-height:1.6}
.card-code{margin:0 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);position:relative;overflow:hidden}
.card-code pre{padding:10px 14px;font-family:'Space Grotesk',monospace;font-size:.76rem;line-height:1.7;color:var(--fg2);overflow-x:auto;white-space:pre}
.card-code .copy-btn{position:absolute;top:6px;right:6px;background:var(--bg2);border:1px solid var(--border);color:var(--fg3);padding:3px 8px;border-radius:4px;font-size:.65rem;cursor:pointer;transition:var(--tr);font-family:'Noto Sans SC';display:flex;align-items:center;gap:3px}
.card-code .copy-btn:hover{color:var(--accent);border-color:var(--accent-b)}
.card-preview{margin:10px 12px 14px;background:#fff;border-radius:var(--rs);padding:12px 16px;color:#1a1a1a;font-family:serif;font-size:.9rem;line-height:1.65;min-height:36px;overflow:hidden}
.card-preview h1,.card-preview h2,.card-preview h3,.card-preview h4,.card-preview h5,.card-preview h6{font-family:'Noto Sans SC',sans-serif;margin:.2em 0}
.card-preview p{margin:.3em 0}
.card-preview ul,.card-preview ol{padding-left:1.4em;margin:.3em 0}
.card-preview pre{background:#f4f3ef;padding:.8em;border-radius:4px;font-family:monospace;font-size:.85em;overflow-x:auto;margin:.3em 0}
.card-preview blockquote{border-left:3px solid #d4a843;padding-left:.8em;margin:.3em 0;color:#555;font-style:italic}
.card-preview table{border-collapse:collapse;width:100%;margin:.3em 0}
.card-preview th,.card-preview td{border:1px solid #ddd;padding:6px 10px;text-align:left}
.card-preview th{background:#f5f5f0;font-weight:600}
.card-preview hr{border:none;border-top:1px solid #ddd;margin:.5em 0}
.card-preview img{max-width:100%}
.card-preview details{margin:.3em 0;border:1px solid #e0ddd5;border-radius:4px;padding:6px 10px}
.card-preview summary{cursor:pointer;font-weight:600}
.card-preview dialog{border:1px solid #ddd;border-radius:6px;padding:16px}
.card-preview mark{background:#ffeaa7;padding:0 2px}
.card-preview input,.card-preview select,.card-preview textarea,.card-preview button{font-family:inherit;font-size:.88em}
.card-preview input[type="text"],.card-preview input[type="password"],.card-preview input[type="email"],.card-preview input[type="number"],.card-preview input[type="date"],.card-preview input[type="search"],.card-preview input[type="url"],.card-preview input[type="tel"],.card-preview textarea{padding:5px 8px;border:1px solid #ccc;border-radius:4px;width:200px}
.card-preview select{padding:5px 8px;border:1px solid #ccc;border-radius:4px}
.card-preview button{padding:5px 16px;border:1px solid #ccc;border-radius:4px;background:#f5f5f0;cursor:pointer}
.card-preview button:hover{background:#eee}
.card-preview progress{width:200px}
.card-preview meter{width:200px}
.card-preview figure{margin:.3em 0;text-align:center}
.card-preview figcaption{font-size:.85em;color:#888}
.card-no-preview{margin:10px 12px 14px;background:var(--bg);border:1px dashed var(--border2);border-radius:var(--rs);padding:10px 14px;font-size:.78rem;color:var(--fg3);text-align:center}

/* 参考表格 */
.ref-section{margin-bottom:3rem}
.ref-title{font-family:'Space Grotesk','Noto Sans SC';font-size:1.3rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.ref-title i{color:var(--accent);font-size:1rem}
.ref-table{width:100%;border-collapse:collapse;font-size:.82rem}
.ref-table thead{position:sticky;top:0}
.ref-table th{text-align:left;padding:10px 14px;background:var(--bg2);color:var(--fg3);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border2)}
.ref-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--fg2);vertical-align:top}
.ref-table tr:hover td{background:rgba(255,255,255,.015)}
.ref-table code{font-family:'Space Grotesk',monospace;font-size:.8em;color:var(--accent);background:var(--accent-d);padding:1px 5px;border-radius:3px}
.ref-table .tag-void::after{content:' ∅';color:var(--red);font-size:.7em}

/* 实体字符网格 */
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.entity-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;display:flex;align-items:center;gap:8px;transition:var(--tr);cursor:pointer}
.entity-item:hover{border-color:var(--border2)}
.entity-char{font-size:1.3rem;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:4px;flex-shrink:0}
.entity-info{font-size:.75rem;line-height:1.4}
.entity-info .en-name{color:var(--fg2);font-weight:500}
.entity-info .en-code{color:var(--fg3);font-family:'Space Grotesk',monospace;font-size:.7rem}

/* 移动端菜单按钮 */
.menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:200;width:40px;height:40px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--fg);font-size:1rem;cursor:pointer;align-items:center;justify-content:center}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}

/* 无结果 */
.no-results{grid-column:1/-1;text-align:center;padding:3rem;color:var(--fg3);font-size:.95rem}

/* 滚动显现 */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

/* 响应式 */
@media(max-width:860px){
  .menu-btn{display:flex}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main{margin-left:0}
  .main-inner{padding:20px 16px 60px;padding-top:60px}
  .cards{grid-template-columns:1fr}
  .entity-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="打开导航"><i class="fa-solid fa-bars"></i></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <h1><i class="fa-solid fa-book"></i> HTML 手册</h1>
    <p>全部标签 · 属性 · 实体 · 速查</p>
  </div>
  <div class="sidebar-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="搜索标签、属性..." aria-label="搜索">
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
</aside>

<div class="main">
  <div class="main-inner" id="mainContent"></div>
</div>

<script>
// ===== 全部 HTML 知识数据 =====
const categories = [
  {
    id:'structure', name:'文档骨架', icon:'fa-file-code',
    desc:'每个 HTML 页面的基础结构，定义文档类型和根容器',
    elements:[
      {tag:'<!DOCTYPE html>',type:'meta',desc:'文档类型声明，告诉浏览器使用 HTML5 标准模式渲染。必须位于文档第一行，不是 HTML 标签',code:'<!DOCTYPE html>\n<html>\n  <head>...</head>\n  <body>...</body>\n</html>',noPreview:true},
      {tag:'<html>',type:'meta',desc:'文档根元素，所有其他元素都必须是它的后代。lang 属性声明页面语言，影响搜索引擎和屏幕阅读器',attrs:['lang'],code:'<html lang="zh-CN">\n  <!-- 页面内容 -->\n</html>',noPreview:true},
      {tag:'<head>',type:'meta',desc:'文档头部容器，包含元数据、样式、脚本引用等。内容不会直接显示在页面上',code:'<head>\n  <meta charset="UTF-8">\n  <title>页面标题</title>\n  <link rel="stylesheet" href="style.css">\n</head>',noPreview:true},
      {tag:'<body>',type:'block',desc:'文档主体容器，所有可见内容都放在这里。浏览器窗口中显示的一切都是 body 的后代',code:'<body>\n  <h1>你好世界</h1>\n  <p>这是页面内容</p>\n</body>',preview:'<h1>你好世界</h1><p>这是页面内容</p>'},
      {tag:'<title>',type:'meta',desc:'页面标题，显示在浏览器标签页上。每个页面必须有且仅有一个 title，也对 SEO 至关重要',code:'<head>\n  <title>我的网页标题</title>\n</head>',noPreview:true},
    ]
  },
  {
    id:'meta', name:'元信息', icon:'fa-circle-info',
    desc:'head 区域内的元数据标签，控制编码、视口、SEO、社交分享等',
    elements:[
      {tag:'<meta>',type:'void',desc:'自闭合元数据标签。charset 设编码，viewport 控制移动端视口，description/keywords 用于 SEO，og: 系列用于社交分享',attrs:['charset','name','content','http-equiv'],code:'<meta charset="UTF-8">\n<meta name="viewport"\n  content="width=device-width, initial-scale=1.0">\n<meta name="description"\n  content="页面描述">\n<meta property="og:title" content="分享标题">',noPreview:true},
      {tag:'<link>',type:'void',desc:'引入外部资源。最常用于加载 CSS 样式表，也可用于网站图标、预加载资源等',attrs:['rel','href','type','media'],code:'<link rel="stylesheet" href="style.css">\n<link rel="icon" href="favicon.ico">\n<link rel="preload" href="font.woff2" as="font">',noPreview:true},
      {tag:'<style>',type:'meta',desc:'内嵌 CSS 样式。应放在 head 中，可通过 media 属性指定生效条件',attrs:['media','type'],code:'<style>\n  body { font-size: 16px; }\n  .highlight { color: gold; }\n</style>',noPreview:true},
      {tag:'<script>',type:'meta',desc:'内嵌或引入 JavaScript。默认同步加载会阻塞页面渲染，加 defer 或 async 可异步执行',attrs:['src','type','defer','async'],code:'<script src="app.js" defer><\/script>\n<script>\n  console.log("内嵌脚本");\n<\/script>',noPreview:true},
      {tag:'<base>',type:'void',desc:'为页面所有相对 URL 设置基准地址。一个文档最多一个 base 标签',attrs:['href','target'],code:'<base href="https://example.com/app/">\n<base target="_blank">',noPreview:true},
      {tag:'<noscript>',type:'block',desc:'当浏览器禁用 JavaScript 时显示的内容。用于提供降级体验',code:'<noscript>\n  <p>请启用 JavaScript 以获得最佳体验</p>\n</noscript>',noPreview:true},
    ]
  },
  {
    id:'text', name:'文本语义', icon:'fa-font',
    desc:'表达文本含义的标签，让内容具有语义而不仅仅是视觉样式',
    elements:[
      {tag:'<h1> ~ <h6>',type:'block',desc:'六级标题，h1 最重要 h6 最小。页面应有且仅有一个 h1，标题层级不要跳跃（如 h1 直接到 h3）',code:'<h1>一级标题</h1>\n<h2>二级标题</h2>\n<h3>三级标题</h3>\n<h4>四级标题</h4>\n<h5>五级标题</h5>\n<h6>六级标题</h6>',preview:'<h1 style="font-size:1.4em">一级标题</h1><h2 style="font-size:1.2em">二级标题</h2><h3 style="font-size:1.05em">三级标题</h3><h4 style="font-size:.95em">四级标题</h4><h5 style="font-size:.88em">五级标题</h5><h6 style="font-size:.82em">六级标题</h6>'},
      {tag:'<p>',type:'block',desc:'段落元素，是最基本的文本块级容器。注意：p 内部不能嵌套其他块级元素（如 div、h1）',code:'<p>这是第一个段落。</p>\n<p>这是第二个段落，两个 p 之间会自动产生间距。</p>',preview:'<p>这是第一个段落。</p><p>这是第二个段落，两个 p 之间会自动产生间距。</p>'},
      {tag:'<span>',type:'inline',desc:'通用行内容器，本身无语义。用于对行内文本应用样式或标记，常配合 class 使用',code:'<p>这段文字中<span style="color:red">红色部分</span>用 span 包裹</p>',preview:'<p>这段文字中<span style="color:red">红色部分</span>用 span 包裹</p>'},
      {tag:'<br>',type:'void',desc:'换行符，在文本中强制换行。不要用多个 br 来制造间距，那是 margin/padding 的职责',code:'<p>第一行文字<br>第二行文字<br>第三行文字</p>',preview:'<p>第一行文字<br>第二行文字<br>第三行文字</p>'},
      {tag:'<hr>',type:'void',desc:'水平分隔线，表示主题转换。是块级元素但无子元素，浏览器默认渲染为一条横线',code:'<h2>第一章</h2>\n<p>内容...</p>\n<hr>\n<h2>第二章</h2>',preview:'<h2 style="font-size:1em">第一章</h2><p>内容...</p><hr><h2 style="font-size:1em">第二章</h2>'},
      {tag:'<pre>',type:'block',desc:'预格式化文本，保留代码中的空格、换行和缩进。常与 code 标签搭配展示代码',code:'<pre><code>function hello() {\n  return "world";\n}</code></pre>',preview:'<pre><code>function hello() {\n  return "world";\n}</code></pre>'},
      {tag:'<code>',type:'inline',desc:'行内代码片段标记。在 pre 内用于标记代码，在段落中用于标记变量名、命令等短代码',code:'<p>使用 <code>console.log()</code> 输出调试信息</p>',preview:'<p>使用 <code style="background:#f0efe8;padding:1px 4px;border-radius:3px">console.log()</code> 输出调试信息</p>'},
      {tag:'<blockquote>',type:'block',desc:'块级引用，表示从其他来源引用的大段内容。浏览器默认加左边距和斜体',attrs:['cite'],code:'<blockquote cite="https://example.com">\n  <p>学而不思则罔，思而不学则殆。</p>\n  <footer>—— 孔子</footer>\n</blockquote>',preview:'<blockquote><p>学而不思则罔，思而不学则殆。</p><footer>—— 孔子</footer></blockquote>'},
      {tag:'<q>',type:'inline',desc:'行内引用，用于段落中的短引用。浏览器会自动添加引号',attrs:['cite'],code:'<p>孔子说：<q>学而不思则罔</q>，这句话很有道理。</p>',preview:'<p>孔子说：<q>学而不思则罔</q>，这句话很有道理。</p>'},
      {tag:'<abbr>',type:'inline',desc:'缩写标记，title 属性提供完整展开形式。鼠标悬停时浏览器会显示完整文本',attrs:['title'],code:'<p><abbr title="HyperText Markup Language">HTML</abbr> 是网页的基础语言。</p>',preview:'<p><abbr title="HyperText Markup Language" style="text-decoration:underline dotted">HTML</abbr> 是网页的基础语言。</p>'},
      {tag:'<mark>',type:'inline',desc:'高亮标记，表示文本因为某种原因被突出显示（如搜索结果中的匹配词）',code:'<p>搜索结果中<mark>关键词</mark>会被高亮显示</p>',preview:'<p>搜索结果中<mark>关键词</mark>会被高亮显示</p>'},

// 渲染单个卡片
function renderCard(el) {
  const badge = typeBadge[el.type] || '';
  const attrsHtml = (el.attrs || []).map(a => `<span class="card-attr">${a}</span>`).join('');

  let previewHtml;
  if (el.noPreview) {
    previewHtml = `<div class="card-no-preview"><i class="fa-solid fa-eye-slash" style="margin-right:4px"></i> 此标签无可见渲染</div>`;
  } else {
    previewHtml = `<div class="card-preview">${el.preview || ''}</div>`;
  }

  // 安全转义代码用于显示
  const safeCode = el.code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  return `<div class="card" data-tag="${el.tag.toLowerCase()}" data-desc="${el.desc}">
    <div class="card-head">
      <span class="card-tag">${el.tag.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>
      ${badge}
      <div class="card-attrs">${attrsHtml}</div>
    </div>
    <div class="card-desc">${el.desc}</div>
    <div class="card-code">
      <pre>${safeCode}</pre>
      <button class="copy-btn" aria-label="复制代码"><i class="fa-regular fa-copy"></i> 复制</button>
    </div>
    ${previewHtml}
  </div>`;
}

// 块级 vs 行内对比表
function renderBlockInlineTable() {
  let rows = blockInlineComparison.map(r =>
    `<tr><td style="font-weight:500;color:var(--fg)">${r.prop}</td><td style="color:#e8c96a">${r.block}</td><td style="color:#7dd4e3">${r.inline}</td></tr>`
  ).join('');

  return `<section class="ref-section reveal" id="ref-block-inline">
    <h2 class="ref-title"><i class="fa-solid fa-arrows-left-right"></i> 块级元素 vs 行内元素</h2>
    <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)">
      <table class="ref-table">
        <thead><tr><th style="width:22%">属性</th><th style="width:39%"><span style="color:var(--accent)">块级 Block</span></th><th style="width:39%"><span style="color:var(--cyan)">行内 Inline</span></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="margin-top:1rem;padding:12px 16px;background:var(--accent-d);border:1px solid var(--border-accent);border-radius:var(--rs);font-size:.82rem;color:var(--fg2)">
      <strong style="color:var(--accent)">关键点：</strong>块级元素垂直相邻的 margin 会<strong>折叠合并</strong>（取较大值而非相加）。使用 <code style="background:var(--bg);padding:1px 6px;border-radius:3px">flex/grid + gap</code> 可完全避免此问题。
    </div>
  </section>`;
}

  ).join('');

  return `<section class="ref-section reveal" id="ref-attrs">
    <h2 class="ref-title"><i class="fa-solid fa-globe"></i> 全局属性</h2>
    <p style="color:var(--fg3);font-size:.88rem;margin-bottom:1rem">所有 HTML 元素都可使用的属性</p>
    <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)">
      <table class="ref-table">
        <thead><tr><th style="width:18%">属性</th><th style="width:47%">说明</th><th style="width:35%">示例</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

// 实体字符
function renderEntities() {
  let items = entities.map(e => {
    // 安全渲染字符
    const safeChar = e.char.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="entity-item" data-entity="${e.code}" title="点击复制 ${e.code}">
      <div class="entity-char">${safeChar}</div>
      <div class="entity-info">
        <div class="en-name">${e.name}</div>
        <div class="en-code">${e.code}</div>
      </div>
    </div>`;
  }).join('');

  return `<section class="ref-section reveal" id="ref-entities">
    <h2 class="ref-title"><i class="fa-solid fa-hashtag"></i> HTML 实体字符</h2>
    <p style="color:var(--fg3);font-size:.88rem;margin-bottom:1rem">在 HTML 中需要转义的特殊字符和常用符号，点击可复制</p>
    <div class="entity-grid">${items}</div>
  </section>`;
}

// HTML5 新特性
function renderHTML5Features() {
  const features = [
    {title:'语义化标签',desc:'新增 header、nav、main、section、article、aside、footer、figure 等标签，让页面结构具有语义含义，有利于 SEO 和无障碍',tags:['<header>','<nav>','<main>','<section>','<article>','<aside>','<footer>']},
    {title:'表单增强',desc:'新增 email、url、number、range、date、color 等输入类型，以及 placeholder、required、pattern、autofocus 等属性，原生实现验证',tags:['type="email"','type="date"','placeholder','required','pattern']},
    {title:'多媒体支持',desc:'原生 video、audio 标签取代 Flash，canvas 提供 2D/3D 绘图能力，SVG 可直接内嵌',tags:['<video>','<audio>','<canvas>','<svg>']},
    {title:'本地存储',desc:'Web Storage（localStorage/sessionStorage）提供比 cookie 更大容量、更简单的客户端存储方案',tags:['localStorage','sessionStorage']},
    {title:'离线与缓存',desc:'Application Cache（已废弃）→ Service Worker + Cache API，实现离线访问和资源缓存策略',tags:['Service Worker','Cache API']},
    {title:'地理定位',desc:'Geolocation API 获取用户地理位置（需用户授权），用于地图、附近搜索等场景',tags:['navigator.geolocation']},
    {title:'拖放 API',desc:'原生 draggable 属性和 Drag & Drop 事件，无需 JS 库即可实现拖放交互',tags:['draggable','ondragstart','ondrop']},
    {title:'Web Workers',desc:'在后台线程运行 JavaScript，不阻塞 UI 主线程，适合计算密集型任务',tags:['Worker','postMessage']},
    {title:'WebSocket',desc:'全双工通信协议，实现服务端主动推送，适用于聊天、实时数据等场景',tags:['WebSocket','onmessage']},
    {title:'新增 API',desc:'History API（路由）、Fullscreen API、Notification API、Fetch API、IntersectionObserver、MutationObserver 等',tags:['history.pushState','fetch()','IntersectionObserver']},
  ];

  let items = features.map(f =>
    `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;transition:border-color .25s" onmouseenter="this.style.borderColor='var(--border2)'" onmouseleave="this.style.borderColor='var(--border)'">
      <h3 style="font-size:.95rem;font-weight:600;margin-bottom:.4rem">${f.title}</h3>
      <p style="font-size:.82rem;color:var(--fg2);line-height:1.6;margin-bottom:.6rem">${f.desc}</p>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${f.tags.map(t=>`<span style="font-family:'Space Grotesk',monospace;font-size:.68rem;color:var(--accent);background:var(--accent-d);padding:2px 7px;border-radius:3px">${t}</span>`).join('')}</div>
    </div>`
  ).join('');

  return `<section class="ref-section reveal" id="ref-html5">
    <h2 class="ref-title"><i class="fa-solid fa-rocket"></i> HTML5 新特性概览</h2>
    <p style="color:var(--fg3);font-size:.88rem;margin-bottom:1.25rem">HTML5 不只是新增标签，还包括一系列 API 和能力扩展</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">${items}</div>
  </section>`;
}

// 复制代码
function copyCode(btn) {
  const pre = btn.closest('.card-code').querySelector('pre');
  const text = pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = '<i class="fa-solid fa-check"></i> 已复制';
    btn.style.color = 'var(--green)';
    setTimeout(() => {
      btn.innerHTML = '<i class="fa-regular fa-copy"></i> 复制';
      btn.style.color = '';
    }, 1500);
  });
}

// 实体字符点击复制
function initEntityCopy() {
  document.querySelectorAll('.entity-item').forEach(item => {
    item.addEventListener('click', () => {
      const code = item.dataset.entity;
      // 将实体解码为实际字符
      const tmp = document.createElement('div');
      tmp.innerHTML = code;
      const char = tmp.textContent;
      navigator.clipboard.writeText(char).then(() => {
        item.style.borderColor = 'var(--accent)';
        item.style.background = 'var(--accent-d)';
        setTimeout(() => {
          item.style.borderColor = '';
          item.style.background = '';
        }, 800);
      });
    });
  });
}

// 搜索过滤
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase().trim();
  const allCards = mainContent.querySelectorAll('.card');
  const allSections = mainContent.querySelectorAll('.cat-section');

  if (!query) {
    allCards.forEach(c => c.style.display = '');
    allSections.forEach(s => {
      s.style.display = '';
      const grid = s.querySelector('.cards');
      if (grid) grid.innerHTML = grid.innerHTML; // 不，这样会丢失事件
    });
    // 恢复所有卡片和分区
    allCards.forEach(c => { c.style.display = ''; c.classList.remove('no-results'); });
    allSections.forEach(s => s.style.display = '');
    // 恢复参考章节
    mainContent.querySelectorAll('.ref-section').forEach(s => s.style.display = '');
    return;
  }

  // 隐藏所有参考章节
  mainContent.querySelectorAll('.ref-section').forEach(s => s.style.display = 'none');

  allSections.forEach(section => {
    const cards = section.querySelectorAll('.card');
    let visibleCount = 0;
    cards.forEach(card => {
      const tag = (card.dataset.tag || '').toLowerCase();
      const desc = (card.dataset.desc || '').toLowerCase();
      const codeText = card.querySelector('pre')?.textContent.toLowerCase() || '';
      if (tag.includes(query) || desc.includes(query) || codeText.includes(query)) {
        card.style.display = '';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });
    section.style.display = visibleCount > 0 ? '' : 'none';
  });
});

// 滚动显现
function initScrollReveal() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });
  mainContent.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

// 导航高亮
function initNavHighlight() {
  const links = sidebarNav.querySelectorAll('.nav-link');
  const allSections = mainContent.querySelectorAll('section[id]');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const link = sidebarNav.querySelector(`.nav-link[href="#${e.target.id}"]`);
        if (link) link.classList.add('active');
      }
    });
  }, { threshold: 0.15, rootMargin: '-60px 0px -50% 0px' });

  allSections.forEach(s => observer.observe(s));
}

// 移动端菜单
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');

menuBtn.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  sidebarOverlay.classList.toggle('open');
});
sidebarOverlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('open');
});

// 初始化
buildNav();
buildContent();
</script>
